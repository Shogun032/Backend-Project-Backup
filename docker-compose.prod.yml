services:
  api:
    build: .
    container_name: hotel-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      TZ: Asia/Bangkok
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-900}
      DATABASE_URL: ${DATABASE_URL:?Set URL-encoded DATABASE_URL for the mysql service}
      REDIS_URL: ${REDIS_URL:?Set URL-encoded REDIS_URL for the redis service}
      RATE_LIMIT_STORAGE: redis
      RATE_LIMIT_PREFIX: ${RATE_LIMIT_PREFIX:-hotel-booking:production:rate-limit}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    ports:
      - '${API_PORT:-3000}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  mysql:
    image: mysql:8.4
    container_name: hotel-mysql-prod
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hotel_booking}
      MYSQL_USER: ${MYSQL_USER:-hotel_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      TZ: Asia/Bangkok
    volumes:
      - mysql_prod_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: hotel-redis-prod
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: ['sh', '-c', 'exec redis-server --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis_prod_data:
  mysql_prod_data:
